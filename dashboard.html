<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StepFun2Opencode Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #0d6efd;
      --secondary-color: #6c757d;
      --success-color: #32CD32;
      --bs-success: #32CD32;
      --bs-success-rgb: 50, 205, 50;
      --danger-color: #dc3545;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 0;
      background-color: #0d1117;
    }
    .dashboard-container {
      position: relative;
      z-index: 10;
      max-width: 1200px;
      margin: 0 auto;
      overflow-x: hidden;
    }
    .card {
      position: relative;
      border: none;
      border-radius: var(--glass-radius, 12px);
      margin-bottom: 20px;
      background: transparent !important;
    }
    .glass-panel {
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      overflow: hidden;
    }
    .glass-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
      background-color: rgba(255, 255, 255, 0.04);
      pointer-events: none;
    }
    .glass-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      pointer-events: none;
    }
    .card-content {
      position: relative;
      z-index: 3;
      border-radius: inherit;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.22);
    }
    .card-header {
      background: rgba(0, 0, 0, 0.2) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 14px;
      color: white;
      padding: 0.4rem 1.25rem;
      position: relative;
      z-index: 4;
    }
    .card-body {
      padding: 0.5rem;
      position: relative;
      z-index: 4;
      backdrop-filter: blur(13px) !important;
      -webkit-backdrop-filter: blur(13px) !important;
    }
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }
    .status-online { background-color: var(--success-color); box-shadow: 0 0 10px var(--success-color); }
    .status-offline { background-color: var(--danger-color); box-shadow: 0 0 10px var(--danger-color); }
    .status-unknown { background-color: var(--secondary-color); }
    .token-blurred {
      filter: blur(5px);
      transition: filter 0.2s ease;
    }
    .token-blurred:hover {
      filter: blur(0) !important;
    }
    .btn-white-bg {
      background: white;
      border: 1px solid white;
      color: #0d1117;
    }
    .btn-white-bg:hover {
      background: rgba(255, 255, 255, 0.85);
      border-color: white;
      color: #0d1117;
    }
    .btn-outline-action {
      border: 1px solid rgba(255, 255, 255, 0.8);
      color: white;
      background: transparent;
    }
    .btn-outline-action:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: white;
      color: white;
    }
    .stats-card {
      background: transparent;
      border-radius: 12px;
      padding: 0;
      text-align: center;
      position: relative;
      z-index: 10;
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
    }
    .stats-value {
      font-size: 28px;
      font-weight: 700;
      color: white;
    }
    .stats-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1050;
    }
    .form-label {
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 6px;
    }
    .form-control, .form-select {
      display: block;
      width: 100%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.375rem 0.75rem;
      font-size: 1rem;
      border-radius: 0.375rem;
    }
    .form-control:focus, .form-select:focus {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      color: white;
      outline: 0;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
    .text-muted {
      color: rgba(255, 255, 255, 0.7) !important;
    }
    h4, h5, strong, .fw-medium {
      color: white !important;
    }
    small {
      color: rgba(255, 255, 255, 0.8) !important;
    }
    .collapsible-header {
      cursor: pointer;
      user-select: none;
    }
    .collapsible-header .toggle-icon {
      transition: transform 0.2s ease;
    }
    .collapsible-header .toggle-icon.collapsed {
      transform: rotate(-90deg);
    }
    .collapse-section {
      transition: all 0.3s ease;
    }
    .collapse-section.collapsed {
      display: none;
    }
    .pool-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .pool-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .pool-name {
      font-weight: 600;
      color: #58a6ff;
      font-size: 0.95rem;
    }
    .pool-status {
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .model-tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.03);
      opacity: 0.5;
      user-select: none;
      transition: all 0.15s ease;
      margin: 1.5px;
    }
    .model-tag.enabled {
      border-color: rgba(50, 205, 50, 0.3);
      background: rgba(50, 205, 50, 0.1);
      opacity: 1;
    }
    .model-tag:hover { opacity: 0.8; }
    .model-tag.enabled:hover { opacity: 1; }
    .model-tag-name {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }
    .model-tag-id {
      font-size: 8px;
      color: #fff;
      white-space: nowrap;
      opacity: 0.6;
    }
    .model-tag input[type="checkbox"] {
      pointer-events: none;
      transform: scale(0.75);
      margin: 0;
    }
    .model-family-group {
      margin-bottom: 6px;
    }
    .model-family-header {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      padding: 2px 0 1px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 2px;
      display: flex;
      align-items: center;
    }
    .model-family-header .badge {
      font-size: 10px;
      margin-left: 6px;
      padding: 0 5px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <svg style="position:absolute;overflow:hidden;width:0;height:0" color-interpolation-filters="sRGB">
    <defs id="glass-defs"></defs>
  </svg>

  <div class="container pt-2">
  <div class="row justify-content-center">
  <div class="dashboard-container col-11">
    <div class="card sticky-top p-0" style="top:0;z-index:100" data-glass>
      <div class="glass-panel"></div>
      <div class="card-content px-2">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h4 class="mb-0"><i class="bi bi-lightning-charge-fill me-2"></i>StepFun2Opencode Dashboard</h4>
          </div>
          <div class="text-end">
            <div>
              <span id="statusIndicator" class="status-indicator status-unknown"></span>
              <span id="statusText" class="fw-medium">Checking...</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row text-center align-items-stretch mb-3">
      <div class="col-6 col-md-3"><div class="stats-card card h-100 d-flex flex-column" data-glass><div class="card-content flex-grow-1 justify-content-center align-items-center d-flex flex-column" style="padding:10px"><div class="stats-value" id="balanceDisplay" style="font-size:1rem">Loading...</div><div class="stats-label">Balance</div></div></div></div>
      <div class="col-6 col-md-3"><div class="stats-card card h-100 d-flex flex-column" data-glass><div class="card-content flex-grow-1 justify-content-center align-items-center d-flex flex-column" style="padding:10px"><div class="stats-value" id="cashBalanceDisplay" style="font-size:1rem">Loading...</div><div class="stats-label">Cash Balance</div></div></div></div>
      <div class="col-6 col-md-3"><div class="stats-card card h-100 d-flex flex-column" data-glass><div class="card-content flex-grow-1 justify-content-center align-items-center d-flex flex-column" style="padding:10px"><div class="stats-value" id="voucherBalanceDisplay" style="font-size:1rem">Loading...</div><div class="stats-label">Voucher Balance</div></div></div></div>
      <div class="col-6 col-md-3"><div class="stats-card card h-100 d-flex flex-column" data-glass><div class="card-content flex-grow-1 justify-content-center align-items-center d-flex flex-column" style="padding:10px"><div class="stats-value" id="cacheHits" style="font-size:1rem">0</div><div class="stats-label">Cache Hits</div></div></div></div>

    <div class="row">

                <i class="bi bi-cpu-fill me-2"></i>Available Models
              </span>

            </div>
            <div class="card-body collapse-section" id="section-models">
              <div id="modelsContainer"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card" data-glass data-section="tokens">
          <div class="glass-panel"></div>
          <div class="card-content">
            <div class="card-header collapsible-header d-flex justify-content-between align-items-center" onclick="toggleSection('tokens')">
              <span>
                <i class="bi bi-chevron-down toggle-icon me-1"></i>
                <i class="bi bi-key-fill me-2"></i>API Key
              </span>
              <span class="d-flex align-items-stretch gap-2" style="height:100%">
                <span class="badge bg-secondary d-flex align-items-center" id="tokenCountBadge">0</span>

          </div>
        </div>

        <div class="card" data-glass data-section="actions">

          <div class="card-content">
            <div class="card-header collapsible-header" onclick="toggleSection('actions')">
              <i class="bi bi-chevron-down toggle-icon collapsed me-1"></i>
              <i class="bi bi-lightning-charge-fill me-2"></i>Quick Actions
            </div>
            <div class="card-body collapse-section collapsed" id="section-actions">

                <button class="btn btn-outline-action" onclick="checkHealth()"><i class="bi bi-activity me-2"></i>Check Health</button>
                <button class="btn btn-outline-action" onclick="testConnection()"><i class="bi bi-wifi me-2"></i>Test Connection</button>
                <button class="btn btn-outline-action" onclick="refreshModels()"><i class="bi bi-arrow-clockwise me-2"></i>Refresh Models</button>
                <button class="btn btn-white-bg" onclick="saveConfiguration()"><i class="bi bi-save me-2"></i>Save Configuration</button>
              </div>
            </div>
          </div>
        </div>

        <div class="card" data-glass data-section="env">
          <div class="glass-panel"></div>
          <div class="card-content">
            <div class="card-header collapsible-header" onclick="toggleSection('env')">
              <i class="bi bi-chevron-down toggle-icon collapsed me-1"></i>
              <i class="bi bi-info-circle-fill me-2"></i>Environment
            </div>
            <div class="card-body collapse-section collapsed" id="section-env">

                <small class="text-muted">Runtime</small>
                <div class="fw-medium" id="runtimeInfo">-</div>

              <div class="mb-2">

              <div class="mb-2">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="wallpaperToggle" onchange="toggleWallpaper()" checked>

                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="card" data-glass data-section="config">
          <div class="glass-panel"></div>
          <div class="card-content">
            <div class="card-header collapsible-header" onclick="toggleSection('config')">
              <i class="bi bi-chevron-down toggle-icon collapsed me-1"></i>
              <i class="bi bi-gear-fill me-2"></i>Proxy Configuration
            </div>
            <div class="card-body collapse-section collapsed" id="section-config">

                    <input type="text" class="form-control form-control-sm" id="requestTimeout" value="15m">
                  </div>
                </div>
                <div class="row">
                  <div class="col-12 mb-2">
                    <label class="form-label" style="font-size:10px;margin-bottom:2px">Upstream URL</label>
                    <input type="url" class="form-control form-control-sm" id="upstreamUrl" value="https://api.stepfun.ai">
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
  </div>

  <!-- Keys Management Modal -->
  <div class="modal fade" id="keysModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content" style="background:#1a1d23;color:white;border:1px solid rgba(255,255,255,0.1)">
        <div class="modal-header border-bottom-0">
          <h5 class="modal-title"><i class="bi bi-key-fill me-2"></i>Manage Keys</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="keysModalBody">
          <div id="keysList"></div>
          <hr style="border-color:rgba(255,255,255,0.1)">
          <div class="mb-3">
            <label class="form-label">Add New Key</label>
            <input type="text" class="form-control form-control-sm mb-2" id="newKeyName" placeholder="Key name (e.g. Key 2)">
            <input type="text" class="form-control form-control-sm mb-2" id="newKeyToken" placeholder="API token">
            <button class="btn btn-success btn-sm w-100" onclick="addKey()"><i class="bi bi-plus-circle me-1"></i>Add Key</button>

          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    console.log('[Glass] Script loaded');
    const SURFACE_FNS = {
      convex_squircle: (x) => Math.pow(1 - Math.pow(1 - x, 4), 0.25),
    };

    function calculateRefractionProfile(glassThickness, bezelWidth, heightFn, ior, samples) {
      samples = samples || 128;
      const eta = 1 / ior;
      function refract(nx, ny) {
        const dot = ny;
        const k = 1 - eta * eta * (1 - dot * dot);
        if (k < 0) return null;
        const sq = Math.sqrt(k);
        return [-(eta * dot + sq) * nx, eta - (eta * dot + sq) * ny];
      }
      const profile = new Float64Array(samples);
      for (let i = 0; i < samples; i++) {
        const x = i / samples;
        const y = heightFn(x);
        const dx = x < 1 ? 0.0001 : -0.0001;
        const y2 = heightFn(x + dx);
        const deriv = (y2 - y) / dx;
        const mag = Math.sqrt(deriv * deriv + 1);
        const ref = refract(-deriv / mag, -1 / mag);
        if (!ref) { profile[i] = 0; continue; }
        profile[i] = ref[0] * ((y * bezelWidth + glassThickness) / ref[1]);
      }
      return profile;
    }

    function generateDisplacementMap(w, h, radius, bezelWidth, profile, maxDisp) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(w, h);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) { d[i] = 128; d[i+1] = 128; d[i+2] = 0; d[i+3] = 255; }
      const r = radius, rSq = r*r, r1Sq = (r+1)**2;
      const rBSq = Math.max(r - bezelWidth, 0)**2;
      const wB = w - r*2, hB = h - r*2, S = profile.length;
      for (let y1 = 0; y1 < h; y1++) {
        for (let x1 = 0; x1 < w; x1++) {
          const x = x1 < r ? x1 - r : x1 >= w - r ? x1 - r - wB : 0;
          const y = y1 < r ? y1 - r : y1 >= h - r ? y1 - r - hB : 0;
          const dSq = x*x + y*y;
          if (dSq > r1Sq || dSq < rBSq) continue;
          const dist = Math.sqrt(dSq);
          const fromSide = r - dist;
          const op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
          if (op <= 0 || dist === 0) continue;
          const cos = x / dist, sin = y / dist;
          const bi = Math.min(((fromSide / bezelWidth) * S) | 0, S - 1);
          const disp = profile[bi] || 0;
          const dX = (-cos * disp) / maxDisp, dY = (-sin * disp) / maxDisp;
          const idx = (y1 * w + x1) * 4;
          d[idx] = (128 + dX * 127 * op + 0.5) | 0;
          d[idx+1] = (128 + dY * 127 * op + 0.5) | 0;
        }
      }
      ctx.putImageData(img, 0, 0);
      return c.toDataURL();
    }

    function generateSpecularMap(w, h, radius, bezelWidth, angle) {
      angle = angle != null ? angle : Math.PI / 3;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(w, h);
      const d = img.data; d.fill(0);
      const r = radius, rSq = r*r, r1Sq = (r+1)**2;
      const rBSq = Math.max(r - bezelWidth, 0)**2;
      const wB = w - r*2, hB = h - r*2;
      const sv = [Math.cos(angle), Math.sin(angle)];
      for (let y1 = 0; y1 < h; y1++) {
        for (let x1 = 0; x1 < w; x1++) {
          const x = x1 < r ? x1 - r : x1 >= w - r ? x1 - r - wB : 0;
          const y = y1 < r ? y1 - r : y1 >= h - r ? y1 - r - hB : 0;
          const dSq = x*x + y*y;
          if (dSq > r1Sq || dSq < rBSq) continue;
          const dist = Math.sqrt(dSq);
          const fromSide = r - dist;
          const op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
          if (op <= 0 || dist === 0) continue;
          const cos = x / dist, sin = -y / dist;
          const dot = Math.abs(cos * sv[0] + sin * sv[1]);
          const edge = Math.sqrt(Math.max(0, 1 - (1 - fromSide)**2));
          const coeff = dot * edge;
          const col = (255 * coeff) | 0;
          const alpha = (col * coeff * op) | 0;
          const idx = (y1 * w + x1) * 4;
          d[idx] = col; d[idx+1] = col; d[idx+2] = col; d[idx+3] = alpha;
        }
      }
      ctx.putImageData(img, 0, 0);
      return c.toDataURL();
    }

    function initLiquidGlass() {
      const cards = document.querySelectorAll('[data-glass]');
      const defs = document.getElementById('glass-defs');
      defs.innerHTML = '';
      cards.forEach(c => {
        const p = c.querySelector('.glass-panel');
        if (p) { p.style.backdropFilter = ''; p.style.webkitBackdropFilter = ''; }
      });
      let filterIndex = 0;
      cards.forEach(card => {
        const panel = card.querySelector('.glass-panel');
        if (!panel) return;
        requestAnimationFrame(() => {
          const rect = card.getBoundingClientRect();
          if (rect.width < 2 || rect.height < 2) return;
          const w = Math.round(rect.width);
          const h = Math.round(rect.height);
          const radius = 12, bezelW = 30, glassThick = 60, ior = 2.5;
          const blurAmt = 0.3, specOpacity = 0.5, specSat = 4;
          const heightFn = SURFACE_FNS.convex_squircle;
          const profile = calculateRefractionProfile(glassThick, bezelW, heightFn, ior, 128);
          const maxDisp = Math.max(...Array.from(profile).map(Math.abs)) || 1;
          const dispUrl = generateDisplacementMap(w, h, radius, bezelW, profile, maxDisp);
          const specUrl = generateSpecularMap(w, h, radius, bezelW * 2.5);
          const scale = maxDisp * 1.0;
          const filterId = 'lg-' + (filterIndex++);
          const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
          filter.setAttribute('id', filterId);
          filter.setAttribute('x', '-20%');
          filter.setAttribute('y', '-20%');
          filter.setAttribute('width', '140%');
          filter.setAttribute('height', '140%');
          filter.innerHTML = `
            <feGaussianBlur in="SourceGraphic" stdDeviation="${blurAmt}" result="blurred_source" />
            <feImage href="${dispUrl}" x="0" y="0" width="${w}" height="${h}" result="disp_map" />
            <feDisplacementMap in="blurred_source" in2="disp_map" scale="${scale}" xChannelSelector="R" yChannelSelector="G" result="displaced" />
            <feColorMatrix in="displaced" type="saturate" values="${specSat}" result="displaced_sat" />
            <feImage href="${specUrl}" x="0" y="0" width="${w}" height="${h}" result="spec_layer" />
            <feComposite in="displaced_sat" in2="spec_layer" operator="in" result="spec_masked" />
            <feComponentTransfer in="spec_layer" result="spec_faded"><feFuncA type="linear" slope="${specOpacity}" /></feComponentTransfer>
            <feBlend in="spec_masked" in2="displaced" mode="normal" result="with_sat" />
            <feBlend in="spec_faded" in2="with_sat" mode="normal" />
          `;
          defs.appendChild(filter);
          panel.style.backdropFilter = `url(#${filterId})`;
          panel.style.webkitBackdropFilter = `url(#${filterId})`;
          void panel.offsetHeight;
        });
      });
      setTimeout(() => {
        cards.forEach(card => {
          const p = card.querySelector('.glass-panel');
          if (!p) return;
          p.style.visibility = 'hidden';
          void p.offsetHeight;
          p.style.visibility = '';
        });
      }, 100);
    }

    let proxyData = null;
    let config = {};
    let models = [];
    let blurTokensEnabled = false;

    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast align-items-center text-white bg-${type} border-0 show`;
      toast.innerHTML = `<div class="d-flex"><div class="toast-body">${message}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
      document.getElementById('toastContainer').appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    async function fetchBingWallpaper() {
      const checked = document.getElementById('wallpaperToggle')?.checked !== false;
      if (!checked) {
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = '#0d1117';
        return;
      }
      document.body.style.backgroundImage = 'url(/api/bg)';
      document.body.style.backgroundRepeat = 'no-repeat';
      document.body.style.backgroundPosition = 'center';
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundAttachment = 'fixed';
      document.body.style.backgroundColor = '#0d1117';
    }

    async function toggleWallpaper() {
      const checked = document.getElementById('wallpaperToggle').checked;
      fetchBingWallpaper();
      try {
        await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enableWallpaper: checked }) });
      } catch (e) {}
    }

    async function loadConfiguration() {
      try {
        const healthResponse = await fetch('/healthz');
        proxyData = await healthResponse.json();
        const configResponse = await fetch('/api/config');
        const configData = await configResponse.json();
        if (configData) {
          config = configData;
          if (document.getElementById('listenAddr')) document.getElementById('listenAddr').value = configData.listenAddr || ':8080';
          if (document.getElementById('upstreamUrl')) document.getElementById('upstreamUrl').value = configData.upstreamBaseURL || 'https://api.stepfun.ai';
          if (document.getElementById('requestTimeout')) document.getElementById('requestTimeout').value = configData.requestTimeout || '15m';
          if (document.getElementById('wallpaperToggle')) document.getElementById('wallpaperToggle').checked = configData.enableWallpaper !== false;
        }
        const modelsResponse = await fetch('/api/models');
        const modelsData = await modelsResponse.json();
        if (modelsData && modelsData.models) { models = modelsData.allModels || modelsData.models; renderModels(modelsData.models); }
        renderTokenPools();
        updateStats();
      } catch (error) {
        showToast('Failed to load configuration', 'danger');
      }
    }

    let editingIndex = -1;
    let deleteIndex = -1;

    async function openKeysModal() {
      try {
        const r = await fetch('/api/keys');
        const data = await r.json();
        const keys = data.keys || [];
        document.getElementById('tokenCountBadge').textContent = keys.length;
        editingIndex = -1;
        deleteIndex = -1;
        renderKeysList(keys);
        const modal = new bootstrap.Modal(document.getElementById('keysModal'));
        modal.show();
      } catch (e) {
        showToast('Failed to load keys', 'danger');
      }
    }

    function renderKeysList(keys) {
      const container = document.getElementById('keysList');
      if (!keys || keys.length === 0) {
        container.innerHTML = '<p class="text-muted text-center py-3">No keys configured</p>';
        return;
      }
      const blurClass = blurTokensEnabled ? 'token-blurred' : '';
      container.innerHTML = keys.map((k, i) => {
        if (editingIndex === i) {
          return `<div class="pool-card">
            <div class="mb-2">
              <label class="form-label" style="font-size:10px">Name</label>
              <input type="text" class="form-control form-control-sm" id="editKeyName" value="${escapeHtml(k.name || '')}">
            </div>
            <div class="mb-2">
              <label class="form-label" style="font-size:10px">Token</label>
              <input type="text" class="form-control form-control-sm" id="editKeyToken" value="${escapeHtml(k.token || '')}">
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-success" onclick="saveEditKey(${i})"><i class="bi bi-check me-1"></i>Save</button>
              <button class="btn btn-sm btn-secondary" onclick="cancelEditKey()"><i class="bi bi-x me-1"></i>Cancel</button>
            </div>
          </div>`;
        }
        const maskedToken = k.token ? k.token.substring(0, 10) + '...' + k.token.substring(k.token.length - 4) : '';
        const isDeleting = deleteIndex === i;
        return `<div class="pool-card">
          <div class="pool-header">
            <div class="pool-name">${escapeHtml(k.name || 'Unnamed')}</div>
            <div>
              <button class="btn btn-sm btn-outline-action me-1" onclick="startEditKey(${i})" title="Edit"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm" style="background:rgba(220,53,69,0.2);color:#dc3545;border:none" onclick="startDeleteKey(${i})" title="Delete"><i class="bi bi-trash"></i></button>
            </div>
          </div>
          <div style="font-size:0.8rem;color:rgba(255,255,255,0.7)">
            <div>Token: <span class="${blurClass}">${maskedToken || '(empty)'}</span></div>
          </div>
          ${isDeleting ? `<div class="mt-2 d-flex gap-2 align-items-center" style="font-size:0.85rem;color:#dc3545"><i class="bi bi-exclamation-triangle"></i> Delete this key?</div>
            <div class="d-flex gap-2 mt-1">
              <button class="btn btn-sm" style="background:#dc3545;color:white;border:none" onclick="confirmDeleteKey(${i})"><i class="bi bi-trash me-1"></i>Delete</button>
              <button class="btn btn-sm btn-secondary" onclick="cancelDeleteKey()">Cancel</button>
            </div>` : ''}
        </div>`;
      }).join('');
    }

    async function addKey() {
      const name = document.getElementById('newKeyName').value.trim() || ('Key ' + (document.querySelectorAll('#keysList .pool-card').length + 1));
      const token = document.getElementById('newKeyToken').value.trim();
      if (!token) { showToast('Token is required', 'warning'); return; }
      try {
        const r = await fetch('/api/keys', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'add', name, token })
        });
        const data = await r.json();
        if (data.success) {
          document.getElementById('newKeyName').value = '';
          document.getElementById('newKeyToken').value = '';
          renderKeysList(data.keys);
          showToast('Key added', 'success');
          loadConfiguration();
        } else {
          showToast('Failed: ' + data.error, 'danger');
        }
      } catch (e) { showToast('Failed to add key', 'danger'); }
    }

    function startEditKey(index) {
      editingIndex = index;
      deleteIndex = -1;
      fetch('/api/keys').then(d => d.json()).then(data => renderKeysList(data.keys));
    }

    function cancelEditKey() {
      editingIndex = -1;
      fetch('/api/keys').then(d => d.json()).then(data => renderKeysList(data.keys));
    }

    async function saveEditKey(index) {
      const name = document.getElementById('editKeyName').value.trim();
      const token = document.getElementById('editKeyToken').value.trim();
      try {
        const r = await fetch('/api/keys', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'update', index, name, token })
        });
        const data = await r.json();
        if (data.success) {
          editingIndex = -1;
          renderKeysList(data.keys);
          showToast('Key updated', 'success');
          loadConfiguration();
        } else {
          showToast('Failed: ' + data.error, 'danger');
        }
      } catch (e) { showToast('Failed to update key', 'danger'); }
    }

    function startDeleteKey(index) {
      deleteIndex = index;
      editingIndex = -1;
      fetch('/api/keys').then(d => d.json()).then(data => renderKeysList(data.keys));
    }

    function cancelDeleteKey() {
      deleteIndex = -1;
      fetch('/api/keys').then(d => d.json()).then(data => renderKeysList(data.keys));
    }

    async function confirmDeleteKey(index) {
      try {
        const r = await fetch('/api/keys', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete', index })
        });
        const data = await r.json();
        if (data.success) {
          deleteIndex = -1;
          renderKeysList(data.keys);
          showToast('Key deleted', 'success');
          loadConfiguration();
        } else {
          showToast('Failed: ' + data.error, 'danger');
        }
      } catch (e) { showToast('Failed to delete key', 'danger'); }
    }

    function renderTokenPools() {
      const container = document.getElementById('tokenPoolsContainer');
      if (!proxyData || !proxyData.token_state || proxyData.token_state.length === 0) {
        container.innerHTML = `
          <div class="text-center py-4">
            <i class="bi bi-key" style="font-size:2rem;color:rgba(255,255,255,0.4)"></i>
            <p class="mt-2 text-muted">No tokens detected</p>
          </div>`;
        return;
      }
      document.getElementById('tokenCountBadge').textContent = proxyData.token_state.length;
      const blurClass = blurTokensEnabled ? 'token-blurred' : '';
      container.innerHTML = proxyData.token_state.map(pool => {
        const status = pool.status || 'none';
        const statusClass = status === 'active' ? 'status-online' : 'status-offline';
        const statusText = status.charAt(0).toUpperCase() + status.slice(1);
        return `<div class="pool-card"><div class="pool-header"><div class="pool-name">${pool.name}</div><div class="pool-status ${statusClass}">${statusText}</div></div><div style="font-size:0.8rem;color:rgba(255,255,255,0.7)"><div>Token: <span class="${blurClass}">${pool.token || '(empty)'}</span></div></div></div>`;
      }).join('');
    }

    function renderModels(enabledModels) {
      const container = document.getElementById('modelsContainer');
      document.getElementById('modelCountBadge').textContent = models.length;
      if (models.length === 0) { container.innerHTML = '<p class="text-muted">No models available</p>'; return; }
      const enabledSet = new Set(enabledModels || models);
      const groups = {};
      models.forEach((model, idx) => {
        let family = 'other';
        if (model.startsWith('step-image')) family = 'step-image';
        else if (model.startsWith('stepaudio')) family = 'stepaudio';
        else if (model.startsWith('step')) family = 'step';
        if (!groups[family]) groups[family] = [];
        groups[family].push({ model, idx });
      });
      const familyOrder = Object.keys(groups).sort();
      container.innerHTML = familyOrder.map(family => {
        const items = groups[family];
        return `<div class="model-family-group"><div class="model-family-header">${escapeHtml(family)} <span class="badge bg-secondary">${items.length}</span></div><div style="display:flex;flex-wrap:wrap;gap:3px">${items.map(({ model, idx }) => {
          const enabled = enabledSet.has(model);
          return `<div class="model-tag${enabled ? ' enabled' : ''}" onclick="toggleModel(${idx})" id="model-${idx}"><input type="checkbox" class="form-check-input"${enabled ? ' checked' : ''}><div><div class="model-tag-name">${escapeHtml(model)}</div><div class="model-tag-id" title="${escapeHtml(model)}">${escapeHtml(model)}</div></div></div>`;
        }).join('')}</div></div>`;
      }).join('');
    }

    async function toggleModel(idx) {
      const tag = document.getElementById(`model-${idx}`);
      const checkbox = tag.querySelector('input[type="checkbox"]');
      const isEnabled = tag.classList.contains('enabled');
      if (isEnabled) { tag.classList.remove('enabled'); checkbox.checked = false; }
      else { tag.classList.add('enabled'); checkbox.checked = true; }
      const enabledModels = models.filter((_, i) => document.getElementById(`model-${i}`).classList.contains('enabled'));
      showToast(`${models[idx]} ${isEnabled ? 'disabled' : 'enabled'}`, 'info');
      try {
        const resp = await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabledModels }) });
        const data = await resp.json();
        if (!data.success) showToast('Failed to save model settings', 'danger');
      } catch (e) { showToast('Failed to save model settings', 'danger'); }
    }

    function toggleBlurTokens(checked) {
      blurTokensEnabled = checked;
      renderTokenPools();
    }

    async function checkHealth(silent = false) {
      try {
        const response = await fetch('/healthz');
        const data = await response.json();
        if (data.ok) {
          proxyData = data;
          document.getElementById('statusIndicator').className = 'status-indicator status-online';
          document.getElementById('statusText').textContent = 'Online';
          renderTokenPools();
          updateStats();
          if (!silent) showToast('Proxy is healthy', 'success');
        } else {
          throw new Error('Unhealthy status');
        }
      } catch (error) {
        document.getElementById('statusIndicator').className = 'status-indicator status-offline';
        document.getElementById('statusText').textContent = 'Offline';
        if (!silent) showToast('Proxy health check failed', 'danger');
      }
    }

    async function testConnection() {
      try {
        const response = await fetch('/v1/models');
        if (response.ok) {
          const data = await response.json();
          showToast(`Connected! ${data.data?.length || 0} models available`, 'success');
        } else {
          throw new Error('Connection failed');
        }
      } catch (error) {
        showToast('Connection test failed', 'danger');
      }
    }

    function refreshModels() {
      loadConfiguration();
      showToast('Models refreshed', 'info');
    }

    async function saveConfiguration() {
      const newConfig = {
        listenAddr: document.getElementById('listenAddr').value,
        upstreamBaseURL: document.getElementById('upstreamUrl').value,
        requestTimeout: document.getElementById('requestTimeout').value,
      };
      try {
        const response = await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newConfig) });
        const data = await response.json();
        if (data.success) { showToast('Configuration saved successfully', 'success'); config = data.config; }
        else { showToast('Failed to save: ' + data.error, 'danger'); }
      } catch (error) {
        showToast('Failed to save configuration', 'danger');
      }
    }

    function updateStats() {
      if (!proxyData) return;
      if (proxyData.runtime) {
        document.getElementById('runtimeInfo').textContent = proxyData.runtime + ' v' + proxyData.runtime_version;
      }
      if (proxyData.started_at) {
        document.getElementById('startedAt').textContent = new Date(proxyData.started_at).toLocaleString();
      }
      if (proxyData.cache) {
        document.getElementById('cacheHits').textContent = proxyData.cache.hits || 0;
      }
      if (proxyData.account) {
        const a = proxyData.account;
        document.getElementById('balanceDisplay').textContent = '$' + (a.balance ?? 0).toFixed(2);
        document.getElementById('cashBalanceDisplay').textContent = '$' + (a.total_cash_balance ?? 0).toFixed(2);
        document.getElementById('voucherBalanceDisplay').textContent = '$' + (a.total_voucher_balance ?? 0).toFixed(2);
      }
    }

    async function fetchAccountInfo() {
      try {
        const r = await fetch('/api/account');
        if (!r.ok) return;
        const data = await r.json();
        document.getElementById('balanceDisplay').textContent = '$' + (data.balance ?? 0).toFixed(2);
        document.getElementById('cashBalanceDisplay').textContent = '$' + (data.total_cash_balance ?? 0).toFixed(2);
        document.getElementById('voucherBalanceDisplay').textContent = '$' + (data.total_voucher_balance ?? 0).toFixed(2);
      } catch (e) {}
    }

    function toggleSection(name) {
      const body = document.getElementById('section-' + name);
      const card = body.closest('[data-section]');
      const icon = card.querySelector('.toggle-icon');
      body.classList.toggle('collapsed');
      icon.classList.toggle('collapsed');
      setTimeout(() => initLiquidGlass(), 50);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    Promise.all([
      loadConfiguration().then(() => fetchBingWallpaper()),
      checkHealth(),
      fetchAccountInfo(),
    ]).then(() => {
      initLiquidGlass();
      setTimeout(() => window.dispatchEvent(new Event('resize')), 1000);
      setTimeout(() => window.dispatchEvent(new Event('resize')), 3000);
    });
    setInterval(() => checkHealth(true), 15000);
    setInterval(() => fetchAccountInfo(), 60000);
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(initLiquidGlass, 150);
    });
  </script>
</body>
</html>
